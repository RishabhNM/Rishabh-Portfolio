<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Portfolio of Rishabh Gupta, a Technical Game Designer with nearly 4 years of experience and 10+ shipped mobile games.">

<meta property="og:description" content="Portfolio of Rishabh Gupta, a Technical Game Designer with nearly 4 years of experience and 10+ shipped mobile games.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Rishabh Gupta Portfolio">
<meta name="twitter:description" content="Portfolio of Rishabh Gupta, a Technical Game Designer with nearly 4 years of experience and 10+ shipped mobile games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #11141B;
  --surface: #181C25;
  --surface-2: #1F2430;
  --line: #2A303D;
  --fg: #ECE8E4;
  --muted: #9EA4B0;
  --accent: #E38B73;
  --accent-soft: #EBA897;
  --on-accent: #1A1210;
  --display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --body: "Lato", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.7 var(--body); -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
strong { color: var(--fg); font-weight: 700; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 24px; }
@media (max-width: 560px) { .wrap { padding-inline: 16px; } }

/* Top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 24px; padding-block: 14px; }
.brand { font: 600 16px/1 var(--display); text-decoration: none; letter-spacing: .01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 20px; margin-left: auto; }
.nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
.nav a:hover { color: var(--fg); }
@media (max-width: 760px) { .nav { display: none; } .top .dl-group { margin-left: auto; } }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
  padding: 8px 16px; border-radius: 999px; font: 600 14px/1 var(--display);
  text-decoration: none; border: 1px solid var(--line); background: var(--surface);
  transition: background .15s, border-color .15s, transform .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: #3A4252; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
.btn small { font: 400 12px/1 var(--mono); opacity: .75; }
.btn svg { width: 16px; height: 16px; flex: none; }
.dl-group { display: flex; gap: 8px; flex-wrap: wrap; }
.top .dl-group { flex-wrap: nowrap; }
@media (max-width: 420px) { .top .wrap { gap: 10px; } .top .btn { padding: 7px 11px; } .top .btn svg { display: none; } .brand { font-size: 15px; } }
.top .btn { min-height: 36px; padding: 7px 14px; font-size: 13px; }
@media (max-width: 420px) { .top .btn small { display: none; } }

/* Intro */
.intro { padding-block: clamp(96px, 18vh, 190px) clamp(80px, 12vh, 140px); min-height: min(86vh, 860px); align-content: center; display: grid; gap: 32px; }
.eyebrow { font: 500 12px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-soft); display: flex; gap: 12px; flex-wrap: wrap; }
.eyebrow span + span::before { content: "/"; margin-right: 12px; color: var(--line); }
.intro h1 { margin: 0; font: 700 clamp(44px, 9vw, 104px)/1.0 var(--display); letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.name-row { position: relative; width: fit-content; max-width: 100%; --d: clamp(52px, 7vw, 88px); margin-top: calc(var(--d) * 0.7); }
.duck-track { position: absolute; left: 0; right: 0; bottom: 100%; height: 0; pointer-events: none; }
.duck-walk { position: absolute; left: 0; bottom: calc(var(--d) * -0.32); width: var(--d); animation: duck-walk 26s linear infinite; }
.duck { display: block; width: 100%; height: auto; image-rendering: pixelated; animation: duck-flip 26s linear infinite; }
@keyframes duck-walk { 0% { left: 0; } 50% { left: calc(100% - var(--d)); } 100% { left: 0; } }
@keyframes duck-flip { 0%, 49.99% { transform: scaleX(1); } 50%, 99.99% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
.role-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; margin-top: -12px; }
.headline { margin: 0; font: 600 clamp(22px, 3.4vw, 36px)/1.2 var(--display); color: var(--accent); letter-spacing: -.005em; }
.loc { font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.intro-card { display: grid; gap: 28px; width: 100%; padding: clamp(22px, 3.5vw, 36px) clamp(22px, 4vw, 44px); background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--radius) + 6px); }
.intro-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.stats { display: flex; flex-wrap: wrap; gap: 12px 40px; margin: 0; padding: 0; list-style: none; }
.stats li { display: grid; gap: 2px; }
.stats b { font: 600 28px/1.1 var(--display); color: var(--fg); font-variant-numeric: tabular-nums; }
.stats span { font-size: 14px; color: var(--muted); }

/* Sections */
section.block { padding-block: clamp(88px, 12vw, 150px); border-top: 1px solid var(--line); scroll-margin-top: 70px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: clamp(36px, 6vw, 64px); }
.sec-head h2 { margin: 0; display: grid; gap: 14px; font: 700 clamp(36px, 6vw, 68px)/1.02 var(--display); letter-spacing: -.02em; color: var(--fg); }
.sec-head h2 .num { font: 500 14px/1 var(--mono); letter-spacing: .14em; color: var(--accent); }
.sec-head h2.idx { display: block; }
.sec-head h2.idx span { color: var(--accent); margin-right: .25em; }
.sec-head p { margin: 0; color: var(--muted); font-size: 15px; }
#projects { padding-top: clamp(56px, 8vw, 96px); }
.sec-sub { margin: calc(-1 * clamp(14px, 3vw, 36px)) 0 clamp(24px, 3.5vw, 36px); max-width: 58ch; color: var(--muted); font-size: clamp(17px, 1.9vw, 20px); line-height: 1.7; }

/* Projects */
.features { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(28px, 4vw, 48px); margin-bottom: clamp(40px, 6vw, 72px); }
.feature { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--radius) + 6px); padding: clamp(22px, 4vw, 48px); }
@media (hover: hover) { .feature { transition: border-color .2s; } .feature:hover { border-color: #3A4252; } }
.f-head { display: grid; gap: 12px; padding-bottom: 28px; margin-bottom: 36px; border-bottom: 1px solid var(--line); }
.f-head h3 { margin: 0; font: 700 clamp(30px, 4.6vw, 52px)/1.08 var(--display); letter-spacing: -.015em; }
.f-genres { display: flex; flex-wrap: wrap; gap: 8px; }
.f-genres .genre { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-soft); background: color-mix(in srgb, var(--accent) 16%, transparent); padding: 7px 12px; border-radius: 999px; }
.f-body { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 36px clamp(32px, 6vw, 80px); align-items: start; }
.f-text p { margin: 0 0 24px; font-size: clamp(17px, 1.7vw, 19px); line-height: 1.8; max-width: 58ch; }
.f-meta h4 { margin: 0 0 14px; font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-soft); }
.f-meta ul { margin: 0 0 28px; padding-left: 18px; display: grid; gap: 8px; }
.f-meta li::marker { color: var(--accent); }
.video { position: relative; flex: none; height: 300px; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #000; scroll-snap-align: start; }
.clip { position: relative; flex: none; height: 300px; width: auto; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: #000; scroll-snap-align: start; }
.clip video { display: block; width: 100%; height: 100%; object-fit: cover; }
.video-link { position: absolute; right: 8px; bottom: 8px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: rgba(17,20,27,.8); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: var(--fg); font: 600 12px/1 var(--display); text-decoration: none; transition: background .15s; }
.video-link:hover { background: var(--surface-2); }
.video-link svg { width: 12px; height: 12px; }
.video iframe { display: block; width: 100%; height: 100%; border: 0; pointer-events: none; }
.shots { display: flex; gap: 14px; overflow-x: auto; margin-top: clamp(36px, 5vw, 56px); padding-bottom: 8px; scroll-snap-type: x proximity; }
.shot { position: relative; flex: none; scroll-snap-align: start; }
.shot img { display: block; cursor: zoom-in; }
.enlarge { position: absolute; right: 8px; bottom: 8px; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; padding: 0; border-radius: 999px; border: 1px solid var(--line); background: rgba(17,20,27,.8); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: var(--fg); cursor: pointer; transition: background .15s, transform .15s; }
.enlarge:hover { background: var(--surface-2); transform: scale(1.06); }
.enlarge svg { width: 16px; height: 16px; }
.lightbox { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--fg); }
.lightbox[open] { display: grid; place-items: center; }
.lightbox::backdrop { background: rgba(6, 8, 12, .86); backdrop-filter: blur(4px); }
.lightbox img, .lightbox video { max-width: min(94vw, 1100px); max-height: 90dvh; width: auto; height: auto; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 12px 48px rgba(0,0,0,.6); }
.lightbox img[hidden], .lightbox video[hidden] { display: none; }
.lightbox .lb-close { position: fixed; top: 16px; right: 16px; }
.shots img { flex: none; height: 300px; width: auto; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); scroll-snap-align: start; }
.shots.fit { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); overflow: visible; align-items: start; }
.shots.fit > .shot, .shots.fit > .clip { width: 100%; height: auto; }
.shots.fit .shot img { width: 100%; height: auto; }
.shots.fit > .video { width: 100%; height: auto; }
@media (max-width: 760px) { .shots.fit { grid-template-columns: 1fr; } .shots.fit .shot img, .shots.fit > .clip, .shots.fit > .video { height: auto; } }
@media (max-width: 760px) { .f-body { grid-template-columns: 1fr; } .shots img, .video, .clip { height: 220px; } }
.kpi-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
.kpi { font: 500 12px/1 var(--mono); padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi b { color: var(--accent-soft); font-weight: 500; margin-left: 4px; }
.kpi-note { font: 400 12px/1.4 var(--mono); color: var(--muted); margin-left: 4px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.more-exp { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 32px; padding: clamp(24px, 4vw, 40px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.more-exp-text { display: flex; align-items: center; gap: 20px; min-width: 0; }
.work-gif { flex: none; width: clamp(96px, 13vw, 140px); height: auto; }
.more-exp h3 { margin: 0 0 8px; font: 700 clamp(24px, 3.4vw, 34px)/1.15 var(--display); letter-spacing: -.01em; }
.more-exp p { margin: 0; color: var(--muted); font-size: 15px; max-width: 56ch; }
.more-exp .btn { min-height: 46px; padding: 10px 20px; font-size: 15px; }

/* Resume / CV viewer */
.viewer {
  width: min(960px, calc(100vw - 32px)); height: min(92vh, 1200px); max-width: none; max-height: none;
  padding: 0; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--fg); overflow: hidden;
}
.viewer[open] { display: flex; flex-direction: column; }
.viewer::backdrop { background: rgba(6, 8, 12, .72); backdrop-filter: blur(3px); }
.viewer-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 12px 20px; border-bottom: 1px solid var(--line); }
.viewer-bar h2 { margin: 0; font: 600 17px/1.2 var(--display); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer-actions { display: flex; gap: 8px; flex: none; }
.viewer-actions .btn { min-height: 36px; padding: 7px 14px; font-size: 13px; }
.btn.icon-only { padding: 7px 9px; }
.viewer-pages { flex: 1; min-height: 0; overflow: auto; background: #0C0E13; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.viewer-pages canvas { max-width: 100%; height: auto; background: #fff; border-radius: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
.viewer-msg { margin: auto; color: var(--muted); text-align: center; max-width: 36ch; }
.viewer-frame { flex: 1; width: 100%; min-height: 60vh; border: 0; border-radius: 4px; background: #fff; }
.viewer-msg.small { margin: 0; font-size: 12.5px; }
@media (max-width: 560px) {
  .viewer { width: 100vw; height: 100dvh; border-radius: 0; border: 0; }
  .viewer-pages { padding: 10px; gap: 10px; }
  .hide-sm { display: none; }
}

/* Stars */
.star { width: 16px; height: 16px; color: var(--accent); flex: none; align-self: center; }
.proj-note { margin: -8px 0 24px; color: var(--muted); font-size: 15px; }
.proj-note .star { display: inline-block; width: 17px; height: 17px; vertical-align: -3px; margin: 0 1px; }
.row.fav { background: color-mix(in srgb, var(--accent) 6%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Favourite games */
.favs { padding-top: clamp(88px, 12vw, 150px); padding-bottom: clamp(48px, 7vw, 90px); border-top: 1px solid var(--line); scroll-margin-top: 70px; }
.fav-note { margin: 0 0 28px; font-size: clamp(19px, 2.2vw, 24px); line-height: 1.65; color: var(--fg); }
.spin { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-height: 320px; display: flex; }
.spin-bg { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transform: scale(1.04); transition: opacity .15s; }
.spin-bg.on { opacity: .6; }
.spin.rolling .spin-bg { filter: blur(3px) saturate(1.2); }
.spin::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(17,20,27,.92) 0%, rgba(17,20,27,.7) 45%, rgba(17,20,27,.25) 100%), linear-gradient(0deg, rgba(17,20,27,.6), transparent 50%); }
.spin-body { position: relative; z-index: 1; display: grid; align-content: end; gap: 12px; padding: 28px; width: 100%; max-width: 640px; }
.spin-label { font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-soft); }
.spin-title { margin: 0; font: 700 clamp(26px, 4.5vw, 44px)/1.1 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.spin-quote { margin: 0; font-size: clamp(16px, 2vw, 19px); line-height: 1.6; color: var(--fg); max-width: 52ch; min-height: 1.6em; }
.spin-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.spin-actions .btn[hidden] { display: none; }
.spin.landed .spin-title, .spin.landed .spin-quote { animation: land .2s ease-out; }
@keyframes land { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 560px) { .spin { min-height: 300px; } .spin-body { padding: 20px; } }

/* About */
.about-lead { margin: 0 0 clamp(48px, 7vw, 80px); max-width: 60ch; font-size: clamp(19px, 2.2vw, 24px); line-height: 1.7; color: var(--fg); }
.about-lead strong { color: var(--accent-soft); }
.facts { margin: 0; display: grid; }
.fact { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 10px 40px; padding: 34px 0; border-top: 1px solid var(--line); }
.fact:last-child { border-bottom: 1px solid var(--line); }
.fact dt { font: 500 12px/1.9 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-soft); }
.fact dd { margin: 0; min-width: 0; }
@media (max-width: 640px) { .fact { grid-template-columns: 1fr; gap: 12px; } }
.about-card { background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--radius) + 6px); padding: clamp(22px, 4vw, 48px); }
.about-card .about-lead { margin-bottom: clamp(28px, 4vw, 44px); }
.about-card .fact:last-child { border-bottom: 0; padding-bottom: 0; }
@media (hover: hover) { .about-card { transition: border-color .2s; } .about-card:hover { border-color: #3A4252; } }
.pills, .tags { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
.pills li { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--fg); }
.pills li.hi { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
.tags li { font-size: 15px; color: var(--fg); }
.tags li:not(:last-child)::after { content: "·"; color: var(--accent); margin-left: 8px; }
.plain { margin: 0; padding-left: 18px; color: var(--fg); display: grid; gap: 10px; max-width: 70ch; }
.plain li::marker { color: var(--accent); }
.plain a { color: var(--accent-soft); }
.edu { display: grid; gap: 4px; }
.edu b { font: 600 17px/1.35 var(--display); }
.edu span { color: var(--muted); font-size: 14px; }

/* Contact */
.contact { padding-block: clamp(88px, 12vw, 150px) 140px; gap: 32px; border-top: 1px solid var(--line); display: grid; gap: 24px; }
.contact h2 { margin: 0; font: 700 clamp(30px, 4.5vw, 48px)/1.1 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.contact .sec-head { margin-bottom: 0; }
.contact .sec-head h2 { font: 700 clamp(36px, 6vw, 68px)/1.02 var(--display); letter-spacing: -.02em; text-wrap: initial; }
.mailrow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.mail { font: 500 clamp(16px, 2.4vw, 22px)/1.3 var(--mono); color: var(--accent-soft); user-select: all; overflow-wrap: anywhere; }
.copy { cursor: pointer; }

/* Scroll reveal and hover effects */
.js .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease-out, transform .6s ease-out; }
.js .reveal.in { opacity: 1; transform: none; }
.spin-bg { transition: opacity .15s, transform .25s ease-out; }
@media (hover: hover) {
  .btn:hover { transform: translateY(-1px); }
  .pills li { transition: border-color .2s, transform .2s; }
  .pills li:hover { border-color: var(--accent); transform: translateY(-2px); }
  .spin:hover .spin-bg { transform: scale(1.08) translate(calc(var(--px, 0) * -12px), calc(var(--py, 0) * -8px)); }
}

.error { margin: 80px auto; max-width: 620px; padding: 24px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--surface); }
.error code { font-family: var(--mono); color: var(--accent-soft); }
</style>
</head>
<body>
<div id="app"><p class="wrap" style="padding-block:80px;color:var(--muted)">Loading…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
(function () {
  // ---------- helpers ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // **bold** and [text](url) inside YAML text
  const md = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const list = a => Array.isArray(a) ? a : [];
  const ytId = u => { const m = String(u || "").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([\w-]{11})/); return m ? m[1] : ""; };
  const initials = t => String(t).replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
  const icon = {
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>',
    out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5"/></svg>',
    star: '<svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
    zoom: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'
  };
  const linkBtns = links => list(links).filter(l => l && l.url)
    .map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ${icon.out}</a>`).join("");
  const dlBtns = (d, primaryFirst) => list(d).map((f, i) =>
    `<a class="btn${primaryFirst && i === 0 ? " primary" : ""}" href="${esc(f.file)}" target="_blank" rel="noopener" data-doc="${esc(f.file)}" data-title="${esc(f.label)}">${icon.doc} ${esc(f.label)}${f.note ? ` <small>${esc(f.note)}</small>` : ""}</a>`).join("");

  // ---------- page ----------
  function render(d) {
    const p = d.profile || {};
    const projects = list(d.projects);
    const favs = list(d.favourites).filter(g => g && g.title);
    const featured = projects.filter(x => x.star);
    document.title = `${p.name ? p.name + " " : ""}Portfolio`;

    const html = `
<header class="top"><div class="wrap">
  <a class="brand" href="#top">${esc(p.name)}<span>.</span></a>
  <nav class="nav" aria-label="Sections">
    <a href="#projects">Projects</a><a href="experience.html">Experience</a><a href="#about">About</a><a href="#contact">Contact</a>
  </nav>
  <div class="dl-group">${dlBtns(d.downloads, true)}</div>
</div></header>

<main id="top">
  <section class="wrap intro">
    <div class="name-row"><h1>${esc(p.name)}</h1><div class="duck-track" aria-hidden="true"><div class="duck-walk"><img class="duck" src="images/duck.gif" alt="" width="256" height="256"></div></div></div>
    <div class="role-line"><p class="headline">${esc(p.headline)}</p>${p.location ? `<span class="loc">${esc(p.location)}</span>` : ""}</div>
    <div class="intro-card">
      ${list(d.stats).length ? `<ul class="stats">${list(d.stats).map(s => `<li><b>${esc(s.value)}</b><span>${esc(s.label)}</span></li>`).join("")}</ul>` : ""}
      <div class="intro-row">
        ${p.email ? `<a class="btn primary" href="#contact">Get in touch</a>` : ""}
        ${linkBtns(p.links)}
      </div>
    </div>
  </section>

  ${featured.length ? `
  <section class="wrap block" id="projects">
    <div class="sec-head"><h2 class="idx"><span>01</span> Featured projects</h2></div>
    ${d.projects_subtitle ? `<p class="sec-sub">${md(d.projects_subtitle)}</p>` : ""}
    ${featured.length ? `<div class="features">${featured.map(x => { return `
      <article class="feature">
        <header class="f-head">
          <h3>${esc(x.title)}</h3>
          ${x.genre ? `<div class="f-genres">${String(x.genre).split(",").map(g => `<span class="genre">${esc(g.trim())}</span>`).join("")}</div>` : ""}
        </header>
        <div class="f-body">
          <div class="f-text">
            ${x.note ? String(x.note).split(/\n\s*\n/).map(para => `<p>${md(para.trim())}</p>`).join("") : ""}
            ${list(x.kpis).length ? `<div class="kpi-row">${list(x.kpis).map(k => `<span class="kpi">${esc(k.label)}<b>${esc(k.value)}</b></span>`).join("")}${x.kpi_note ? `<span class="kpi-note">${esc(x.kpi_note)}</span>` : ""}</div>` : ""}
          </div>
          <div class="f-meta">
            ${x.role ? `<h4>My role</h4><ul>${String(x.role).split(",").map(r => `<li>${esc(r.trim())}</li>`).join("")}</ul>` : ""}
            <div class="links">${linkBtns(x.links)}</div>
          </div>
        </div>
        ${ytId(x.video) || list(x.images).length || list(x.clips).length ? `<div class="shots${x.fit ? " fit" : ""}"${x.fit ? ` style="--n:${list(x.clips).length + (ytId(x.video) ? 1 : 0) + list(x.images).length}"` : ""}>${list(x.clips).map(c => { c = typeof c === "string" ? { src: c } : (c || {}); return c.src ? `<div class="clip"${/^\d+(\.\d+)?\s*[\/:]\s*\d+(\.\d+)?$/.test(String(c.ratio || "")) ? ` style="aspect-ratio:${esc(String(c.ratio).replace(":", "/"))}"` : ""}><video src="${esc(c.src)}" muted loop autoplay playsinline preload="metadata" aria-label="${esc(x.title)} gameplay clip"></video><button class="enlarge" type="button" data-video="${esc(c.src)}" aria-label="Enlarge ${esc(x.title)} gameplay clip">${icon.zoom}</button></div>` : ""; }).join("")}${ytId(x.video) ? `<div class="video"${/^\d+(\.\d+)?\s*[\/:]\s*\d+(\.\d+)?$/.test(String(x.video_ratio || "")) ? ` style="aspect-ratio:${esc(String(x.video_ratio).replace(":", "/"))}"` : ""}><iframe src="https://www.youtube-nocookie.com/embed/${ytId(x.video)}?autoplay=1&mute=1&loop=1&playlist=${ytId(x.video)}&controls=0&modestbranding=1&rel=0&playsinline=1&iv_load_policy=3&disablekb=1&fs=0" title="${esc(x.title)} video" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe><a class="video-link" href="https://www.youtube.com/watch?v=${ytId(x.video)}" target="_blank" rel="noopener" aria-label="Watch ${esc(x.title)} on YouTube">YouTube ${icon.out}</a></div>` : ""}${list(x.images).map((src, n) => `<div class="shot"><img src="${esc(src)}" alt="${esc(x.title)} screenshot ${n + 1}" loading="lazy"><button class="enlarge" type="button" data-full="${esc(src)}" data-alt="${esc(x.title)} screenshot ${n + 1}" aria-label="Enlarge ${esc(x.title)} screenshot ${n + 1}">${icon.zoom}</button></div>`).join("")}</div>` : ""}
      </article>`; }).join("")}</div>` : ""}
    <div class="more-exp">
      <div class="more-exp-text">
        <img class="work-gif" src="images/work.gif" alt="" width="512" height="512">
        <div>
        <h3>${esc(d.experience_heading || "Work Experience")}</h3>
        <p>${esc(d.experience_blurb || "Every game I've worked on, grouped by company and the time I spent there.")}</p>
        </div>
      </div>
      <a class="btn primary" href="experience.html">View all ${icon.out}</a>
    </div>
  </section>` : ""}

  <section class="wrap block" id="about">
    <div class="sec-head"><h2 class="idx"><span>02</span> About</h2></div>
    <div class="about-card">
      ${p.about ? `<p class="about-lead">${md(p.about)}</p>` : ""}
      <dl class="facts">
        ${d.skills ? `<div class="fact"><dt>Skills</dt><dd><ul class="pills">${list(d.skills.highlight).map(s => `<li class="hi">${esc(s)}</li>`).join("")}${list(d.skills.other).map(s => `<li>${esc(s)}</li>`).join("")}</ul></dd></div>` : ""}
        ${list(d.achievements).length ? `<div class="fact"><dt>Beyond work</dt><dd><ul class="plain">${list(d.achievements).map(a => `<li>${md(a)}</li>`).join("")}</ul></dd></div>` : ""}
        ${list(d.education).length ? `<div class="fact"><dt>Education</dt><dd>${list(d.education).map(e => `<div class="edu"><b>${esc(e.degree)}</b><span>${esc(e.school)} · ${esc(e.dates)}</span></div>`).join("")}</dd></div>` : ""}
        ${list(d.languages).length ? `<div class="fact"><dt>Languages</dt><dd><ul class="tags">${list(d.languages).map(x => `<li>${esc(x)}</li>`).join("")}</ul></dd></div>` : ""}
        ${list(d.hobbies).length ? `<div class="fact"><dt>Hobbies</dt><dd><ul class="tags">${list(d.hobbies).map(x => `<li>${esc(x)}</li>`).join("")}</ul></dd></div>` : ""}
      </dl>
    </div>
  </section>

  ${favs.length ? `
  <section class="wrap favs" id="favourites">
    <div class="sec-head"><h2 class="idx"><span>03</span> Feeling lucky?</h2></div>
    ${d.favourites_note ? `<p class="fav-note">${md(d.favourites_note)}</p>` : ""}
    <div class="spin" id="spin">
      <div class="spin-bg" id="spinBg"></div>
      <div class="spin-body">
        <div class="spin-label" id="spinLabel">Random favourite</div>
        <h3 class="spin-title" id="spinTitle">Spin for one of my favourites</h3>
        <p class="spin-quote" id="spinQuote"></p>
        <div class="spin-actions">
          <button class="btn primary" type="button" id="spinBtn">Spin</button>
          <a class="btn" id="spinLink" href="#" target="_blank" rel="noopener" hidden><span id="spinLinkText">Steam</span> ${icon.out}</a>
        </div>
        <div class="sr" id="spinLive" aria-live="polite"></div>
      </div>
    </div>
  </section>` : ""}

  <section class="wrap contact" id="contact">
    <div class="sec-head"><h2 class="idx"><span>04</span> Contact</h2></div>
    <h2>${esc(p.contact_heading || "Want to connect? Awesome!")}</h2>
    ${p.email ? `<div class="mailrow"><span class="mail" id="mail">${esc(p.email)}</span>
      <button class="btn copy" type="button" id="copyMail">${icon.copy} <span>Copy email</span></button>
      <a class="btn" href="mailto:${esc(p.email)}">${icon.mail} Send email</a></div>` : ""}
    ${p.phone ? `<p style="margin:0;color:var(--muted);font-family:var(--mono)">${esc(p.phone)}</p>` : ""}
    <div class="intro-row">${linkBtns(p.links)}${dlBtns(d.downloads, false)}</div>
  </section>
</main>
<dialog class="lightbox" id="lightbox" aria-label="Screenshot preview">
  <img id="lbImg" alt="">
  <video id="lbVideo" controls loop playsinline hidden></video>
  <button class="btn icon-only lb-close" type="button" id="lbClose" aria-label="Close preview">${icon.close}</button>
</dialog>
<dialog class="viewer" id="viewer" aria-labelledby="viewerTitle">
  <div class="viewer-bar">
    <h2 id="viewerTitle">Resume</h2>
    <div class="viewer-actions">
      <a class="btn primary" id="viewerDownload" href="#" download>${icon.down} Download</a>
      <a class="btn" id="viewerOpen" href="#" target="_blank" rel="noopener">${icon.out} <span class="hide-sm">Open in new tab</span></a>
      <button class="btn icon-only" type="button" id="viewerClose" aria-label="Close">${icon.close}</button>
    </div>
  </div>
  <div class="viewer-pages" id="viewerPages" tabindex="0" aria-label="Document preview"></div>
</dialog>`;
    document.getElementById("app").innerHTML = html;

    // Sections easing in and the spin card art following the mouse
    const root = document.documentElement;
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!calm) {
      if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const card = document.getElementById("spin");
        if (card) card.addEventListener("pointermove", e => {
          const r = card.getBoundingClientRect();
          card.style.setProperty("--px", ((e.clientX - r.left) / r.width - .5).toFixed(3));
          card.style.setProperty("--py", ((e.clientY - r.top) / r.height - .5).toFixed(3));
        });
      }
      if ("IntersectionObserver" in window) {
        root.classList.add("js");
        const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: .08, rootMargin: "0px 0px -40px 0px" });
        document.querySelectorAll(".feature, .more-exp, .about-card, .fav-note, .spin, .contact > *").forEach(el => { el.classList.add("reveal"); io.observe(el); });
      }
    }

    // Screenshot and clip enlarge
    const lb = document.getElementById("lightbox"), lbImg = document.getElementById("lbImg"), lbVid = document.getElementById("lbVideo");
    const openShot = b => {
      if (!lb.showModal) return;
      const isVid = !!b.dataset.video;
      lbImg.hidden = isVid; lbVid.hidden = !isVid;
      if (isVid) { lbVid.src = b.dataset.video; lbVid.play().catch(() => {}); }
      else { lbImg.src = b.dataset.full; lbImg.alt = b.dataset.alt || ""; }
      lb.showModal();
    };
    document.querySelectorAll(".shot, .clip").forEach(w => {
      const b = w.querySelector(".enlarge");
      if (!b) return;
      const m = w.querySelector("img, video");
      m.style.cursor = "zoom-in";
      m.addEventListener("click", () => openShot(b));
      b.addEventListener("click", () => openShot(b));
    });
    const tidy = () => { lbImg.removeAttribute("src"); lbVid.pause(); lbVid.removeAttribute("src"); lbVid.load(); };
    const shut = () => { lb.close(); tidy(); };
    document.getElementById("lbClose").addEventListener("click", shut);
    lb.addEventListener("click", e => { if (e.target !== lbVid && e.target !== document.getElementById("lbClose")) shut(); });
    lb.addEventListener("close", tidy);

    // Resume / CV viewer
    const dlg = document.getElementById("viewer");
    const pagesBox = document.getElementById("viewerPages");
    let renderId = 0;
    // PDF.js draws the pages itself, so the preview works the same on phones and desktops
    const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    let pdfjsReady = null;
    const loadPdfjs = () => pdfjsReady || (pdfjsReady = new Promise((ok, bad) => {
      const sc = document.createElement("script");
      sc.src = PDFJS + "pdf.min.js";
      sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; ok(window.pdfjsLib); };
      sc.onerror = bad;
      document.head.appendChild(sc);
    }));
    async function showDoc(file) {
      const id = ++renderId;
      pagesBox.innerHTML = '<p class="viewer-msg">Loading…</p>';
      try {
        const lib = await loadPdfjs();
        const res = await fetch(file, { cache: "no-cache" });   // always check for a newer file
        if (!res.ok) throw new Error("PDF not found");
        const pdf = await lib.getDocument({ data: await res.arrayBuffer() }).promise;
        if (id !== renderId) return;
        pagesBox.innerHTML = "";
        const width = Math.min(pagesBox.clientWidth - 32, 860);
        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          if (id !== renderId) return;
          const base = page.getViewport({ scale: 1 });
          const scale = width / base.width;
          const ratio = window.devicePixelRatio || 1;
          const vp = page.getViewport({ scale: scale * ratio });
          const c = document.createElement("canvas");
          c.width = vp.width; c.height = vp.height;
          c.style.width = Math.round(base.width * scale) + "px";
          c.setAttribute("aria-label", `Page ${n} of ${pdf.numPages}`);
          pagesBox.appendChild(c);
          await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        }
      } catch (err) {
        if (id !== renderId) return;
        console.warn("PDF preview failed:", err);
        // Fall back to the browser's own PDF viewer (works on most computers)
        pagesBox.innerHTML = `<iframe class="viewer-frame" src="${file}#view=FitH" title="Document preview"></iframe>
          <p class="viewer-msg small">Can't see it? Use <b>Open in new tab</b> or <b>Download</b> above.</p>`;
      }
    }
    document.querySelectorAll("[data-doc]").forEach(a => a.addEventListener("click", e => {
      if (!dlg.showModal) return;              // very old browser: just follow the link
      e.preventDefault();
      const file = a.dataset.doc;
      document.getElementById("viewerTitle").textContent = a.dataset.title;
      document.getElementById("viewerDownload").href = file;
      document.getElementById("viewerDownload").setAttribute("download", file.split("/").pop());
      document.getElementById("viewerOpen").href = file;
      dlg.showModal();
      showDoc(file);
      document.body.style.overflow = "hidden";
    }));
    const closeViewer = () => dlg.close();
    document.getElementById("viewerClose").addEventListener("click", closeViewer);
    dlg.addEventListener("click", e => { if (e.target === dlg) closeViewer(); });   // click outside
    dlg.addEventListener("close", () => { renderId++; pagesBox.innerHTML = ""; document.body.style.overflow = ""; });

    // Favourite games
    if (favs.length) {
      const art = g => g.image || (g.steam ? `https://cdn.akamai.steamstatic.com/steam/apps/${g.steam}/header.jpg` : "");
      favs.forEach(g => { const u = art(g); if (u) new Image().src = u; });
      const box = document.getElementById("spin"), bg = document.getElementById("spinBg");
      const label = document.getElementById("spinLabel"), title = document.getElementById("spinTitle");
      const quote = document.getElementById("spinQuote"), go = document.getElementById("spinBtn");
      const link = document.getElementById("spinLink"), live = document.getElementById("spinLive");
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let cur = -1, busy = false;
      const show = (i, done) => {
        const g = favs[i], u = art(g);
        bg.style.backgroundImage = u ? `url("${u}")` : "";
        bg.classList.toggle("on", !!u);
        title.textContent = g.title;
        quote.textContent = done ? (g.quote || "") : "";
        if (done) {
          label.textContent = "Favourite game";
          const url = g.link || (g.steam ? `https://store.steampowered.com/app/${g.steam}` : "");
          if (url) { link.href = url; document.getElementById("spinLinkText").textContent = g.link_label || "Steam"; link.hidden = false; } else link.hidden = true;
          live.textContent = `${g.title}. ${g.quote || ""}`;
        } else { label.textContent = "Rolling…"; link.hidden = true; }
      };
      go.addEventListener("click", () => {
        if (busy) return;
        let final;
        do { final = Math.floor(Math.random() * favs.length); } while (favs.length > 1 && final === cur);
        const seq = [];
        for (let k = 0; k < 10; k++) {
          let n;
          do { n = Math.floor(Math.random() * favs.length); } while (favs.length > 1 && n === (seq[k - 1] ?? cur));
          seq.push(n);
        }
        if (favs.length > 1 && seq[seq.length - 1] === final) seq.pop();
        seq.push(final);
        const finish = () => {
          cur = final; busy = false; go.disabled = false; go.textContent = "Spin again";
          box.classList.remove("rolling"); box.classList.remove("landed"); void box.offsetWidth;
          box.classList.add("landed");
          show(final, true);
        };
        if (still || favs.length === 1) return finish();
        busy = true; go.disabled = true; box.classList.remove("landed"); box.classList.add("rolling");
        let step = 0;
        const tick = () => {
          if (step >= seq.length - 1) return finish();
          show(seq[step], false);
          step++;
          setTimeout(tick, 55);   // same quick speed all the way, no slowing down
        };
        tick();
      });
    }

    const btn = document.getElementById("copyMail");
    if (btn) btn.addEventListener("click", () => {
      const label = btn.querySelector("span");
      const done = t => { label.textContent = t; setTimeout(() => (label.textContent = "Copy email"), 1800); };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("Selected, press Ctrl+C"); };
      try { navigator.clipboard.writeText(p.email).then(() => done("Copied"), fallback); } catch (e) { fallback(); }
    });
  }

  function fail(msg) {
    document.getElementById("app").innerHTML = `<div class="wrap"><div class="error">
      <h2 style="margin-top:0;font-family:var(--display)">The page couldn't load its content</h2>
      <p>${msg}</p></div></div>`;
  }

  fetch("site.yaml", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("not found"); return r.text(); })
    .then(t => {
      let data;
      try { data = jsyaml.load(t); }
      catch (e) { return fail(`There's a mistake in <code>site.yaml</code>: ${esc(e.message)}<br>It's usually a missing quote mark or an indent that moved.`); }
      render(data || {});
    })
    .catch(() => fail(`<code>site.yaml</code> could not be read. If you opened <code>index.html</code> by double-clicking it, browsers block that. Run <code>python -m http.server</code> in this folder and open <code>http://localhost:8000</code> instead. Once the site is online, this works on its own.`));
})();
</script>
</body>
</html>
