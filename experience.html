<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Experience | Rishabh Gupta</title>
<meta name="description" content="Complete work experience of Rishabh Gupta, a Technical Game Designer: every game, grouped by company.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #11141B;
  --surface: #181C25;
  --surface-2: #1F2430;
  --line: #2A303D;
  --fg: #ECE8E4;
  --muted: #9EA4B0;
  --accent: #E38B73;
  --accent-soft: #EBA897;
  --on-accent: #1A1210;
  --display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --body: "Lato", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.7 var(--body); -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
strong { color: var(--fg); font-weight: 700; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 24px; }
@media (max-width: 560px) { .wrap { padding-inline: 16px; } }

/* Top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 24px; padding-block: 14px; }
.brand { font: 600 16px/1 var(--display); text-decoration: none; letter-spacing: .01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 20px; margin-left: auto; }
.nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
.nav a:hover { color: var(--fg); }
@media (max-width: 760px) { .nav { display: none; } .top .dl-group { margin-left: auto; } }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
  padding: 8px 16px; border-radius: 999px; font: 600 14px/1 var(--display);
  text-decoration: none; border: 1px solid var(--line); background: var(--surface);
  transition: background .15s, border-color .15s, transform .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: #3A4252; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
.btn small { font: 400 12px/1 var(--mono); opacity: .75; }
.btn svg { width: 16px; height: 16px; flex: none; }
.dl-group { display: flex; gap: 8px; flex-wrap: wrap; }
.top .dl-group { flex-wrap: nowrap; }
@media (max-width: 420px) { .top .wrap { gap: 10px; } .top .btn { padding: 7px 11px; } .top .btn svg { display: none; } .brand { font-size: 15px; } }
.top .btn { min-height: 36px; padding: 7px 14px; font-size: 13px; }
@media (max-width: 420px) { .top .btn small { display: none; } }

/* Sections */
section.block { padding-block: clamp(88px, 12vw, 150px); border-top: 1px solid var(--line); scroll-margin-top: 70px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: clamp(36px, 6vw, 64px); }
.sec-head h2 { margin: 0; display: grid; gap: 14px; font: 700 clamp(36px, 6vw, 68px)/1.02 var(--display); letter-spacing: -.02em; color: var(--fg); }
.sec-head h2 .num { font: 500 14px/1 var(--mono); letter-spacing: .14em; color: var(--accent); }
.sec-head p { margin: 0; color: var(--muted); font-size: 15px; }

/* Experience */
.page { padding-block: clamp(56px, 9vw, 110px) 140px; }
.back { display: inline-block; margin-bottom: 28px; color: var(--muted); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--fg); }
.companies { display: grid; gap: 20px; }
.company { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.company-head {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px;
  padding: 18px 22px; border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.company-head h3 { margin: 0; font: 600 20px/1.25 var(--display); }
.company-head h3 span { color: var(--accent); font-weight: 500; }
.company-head .meta { font: 400 13px/1.4 var(--mono); color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.company-head .meta b { color: var(--accent-soft); font-weight: 500; }
.rows { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 12px 24px; align-items: center;
  padding: 18px 22px; border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row .t { min-width: 0; display: grid; gap: 6px; }
.row .name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.row .name b { font: 600 17px/1.3 var(--display); }
.row .genre { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-soft); background: color-mix(in srgb, var(--accent) 16%, transparent); padding: 5px 8px; border-radius: 999px; }
.row .role { color: var(--fg); font-size: 14px; }
.row .note { color: var(--muted); font-size: 14px; max-width: 70ch; }
.kpi-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
.kpi { font: 500 12px/1 var(--mono); padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi b { color: var(--accent-soft); font-weight: 500; margin-left: 4px; }
.kpi-note { font: 400 12px/1.4 var(--mono); color: var(--muted); margin-left: 4px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.row .links { justify-content: flex-end; }
.row .btn { min-height: 34px; padding: 7px 13px; font-size: 12.5px; }
@media (max-width: 680px) {
  .row { grid-template-columns: 1fr; padding: 16px 18px; }
  .company-head { padding: 16px 18px; }
  .row .links { justify-content: flex-start; }
}

.kpi-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
.kpi { font: 500 12px/1 var(--mono); padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.kpi b { color: var(--accent-soft); font-weight: 500; margin-left: 4px; }
.kpi-note { font: 400 12px/1.4 var(--mono); color: var(--muted); margin-left: 4px; }
.error { margin: 80px auto; max-width: 620px; padding: 24px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--surface); }
.error code { font-family: var(--mono); color: var(--accent-soft); }
@media (hover: hover) {
  .btn:hover { transform: translateY(-1px); }
  .company { transition: border-color .2s; }
  .company:hover { border-color: #3A4252; }
}
</style>
</head>
<body>
<div id="app"><p class="wrap" style="padding-block:80px;color:var(--muted)">Loading…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
(function () {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const md = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const list = a => Array.isArray(a) ? a : [];
  const icon = {
    out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5"/></svg>'
  };
  const linkBtns = links => list(links).filter(l => l && l.url)
    .map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ${icon.out}</a>`).join("");

  function render(d) {
    const p = d.profile || {};
    const projects = list(d.projects);
    const jobs = list(d.experience);
    // Companies in the order of the experience list, then any others (e.g. Game Jams)
    const groups = jobs.map(j => ({ name: j.company, job: j, items: [] }));
    projects.forEach(x => {
      const key = x.studio || "Other";
      let g = groups.find(g => g.name === key);
      if (!g) groups.push(g = { name: key, items: [] });
      g.items.push(x);
    });
    document.title = `Work Experience | ${p.name || ""}`.trim();

    document.getElementById("app").innerHTML = `
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">${esc(p.name)}<span>.</span></a>
  <nav class="nav" aria-label="Sections">
    <a href="index.html#projects">Projects</a><a href="experience.html" aria-current="page" style="color:var(--fg)">Experience</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a>
  </nav>
</div></header>
<main class="wrap page">
  <a class="back" href="index.html#projects">&larr; Back to featured projects</a>
  <div class="sec-head"><h2>${esc(d.experience_heading || "Work Experience")}</h2></div>
  <div class="companies">${groups.filter(g => g.items.length).map(g => `
    <article class="company">
      <header class="company-head">
        <h3>${esc(g.name)}${g.job ? ` <span>| ${esc(g.job.role)}</span>` : ""}</h3>
        <div class="meta">${g.job ? `<span>${esc(g.job.dates)}</span>` : ""}<span><b>${g.items.length}</b> ${g.items.length === 1 ? "project" : "projects"}</span></div>
      </header>
      <ul class="rows">${g.items.map(x => `
        <li class="row">
          <div class="t">
            <div class="name"><b>${esc(x.title)}</b>${x.genre ? `<span class="genre">${esc(x.genre)}</span>` : ""}</div>
            ${x.role ? `<div class="role">${esc(x.role)}</div>` : ""}
          </div>
          <div class="links">${linkBtns(x.links)}</div>
        </li>`).join("")}
      </ul>
    </article>`).join("")}
  </div>
</main>`;
  }

  function fail(msg) {
    document.getElementById("app").innerHTML = `<div class="wrap"><div class="error"><h2 style="margin-top:0;font-family:var(--display)">The page couldn't load its content</h2><p>${msg}</p></div></div>`;
  }

  fetch("site.yaml", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("not found"); return r.text(); })
    .then(t => {
      let data;
      try { data = jsyaml.load(t); }
      catch (e) { return fail(`There's a mistake in <code>site.yaml</code>: ${esc(e.message)}`); }
      render(data || {});
    })
    .catch(() => fail(`<code>site.yaml</code> could not be read. Run <code>python -m http.server</code> in this folder and open <code>http://localhost:8000</code>.`));
})();
</script>
</body>
</html>
