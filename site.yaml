  - title: "I Ended A 100-Year War By Spinning A Yo-Yo!"
    star: true
    studio: Game Jams
    genre: Tower Defence
    spin_word: yo-yo
    toy_button: "Start Spinnin'"
    role: Game Designer, Systems Designer, Economy Balance, Everything... basically
    note: |-
      I Ended A 100-Year War By Spinning A Yo-Yo!, or !!IEA100YWBSAY!! for short ::(which isn't really short, is it?)::, is a tower defence roguelite. Defend the kingdom by spinning your trusty yo-yo, and get upgrades as you beat waves of enemies to power it up.
    details:
      - "**Systems Design:** A tower defence roguelite, made as a great test of my skills in economy balance and systems design. I came up with the yo-yo types, unique upgrades for the yo-yos and enemy behaviour in a short span of time."
      - "**Economy Balance:** Balancing the economy was the main challenge. I targeted around 15-20 minutes of playtime to finish the game, but there wasn't enough time to test it in the 4 days of development. It turned out great, mostly from my hunch, and players were happy with the game flow."
    clips:
