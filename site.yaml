projects:
  - title: "Cozy Words: Word Trivia"
    star: true
    studio: Nearmint Studios
    genre: Word, Trivia
    role: Systems Design, UI Design, Unity Developer
    note: |-
      Cozy Words is a word trivia game. Players make words from a grid of letter tiles to reveal the objective phrase. The levels cover pop culture, geography trivia and more.
    kpis:
      - label: CPI
        value: "$1.00"
      - label: D1
        value: "32%"
      - label: D7
        value: "5%"
    kpi_note: First test with HitApps (US)
    details:
      - "**Tile Grid System:** Players can tap anywhere on the grid to build words, which means a lot of RNG. The letter spawn rates were tuned so short words are easy to find, but the grid still offers useful letters for longer ones."
      - "**Objective Phrase:** Every word you make reveals the matching letters in the phrase, so the words you build directly drive your progress."
      - "**==Mystery Tile==:** A word with no letters for the phrase would be wasted. Those extra tiles now count toward unlocking a ==Mystery Tile==, which reveals a random hidden letter."
    clips:
      - src: images/cozy-words-clip.mp4
        ratio: 360/640
    images:
      - images/cozy-words-1.jpg
      - images/cozy-words-2.jpg
      - images/cozy-words-3.jpg
      - images/cozy-words-4.jpg
    links:
      - label: Google Play
        url: https://play.google.com/store/apps/details?id=com.NearMint.CozyWords&hl=en_IN

  - title: "Crash Attack!"
    star: true
    studio: Nearmint Studios
    genre: Arcade
    role: Systems Design, UI Design, Unity Developer
    note: |-
      Crash Attack! is an arcade game where you launch balls to break blocks. Your goal is to dig all the way to the bottom. Pick upgrades along the way to do more damage and shoot more balls.
    kpis:
      - label: CPI
        value: "$1.65"
      - label: D1
        value: "30%"
      - label: D7
        value: "10%"
      - label: Playtime
        value: "30 min"
    kpi_note: Tested with Voodoo
    bouncing_ball: true
    details:
      - "**Math Gates:** After prototyping the base loop of launching balls to break blocks, we tested math gates to make levels more meaningful and push players to find better angles around the blocks. It made for ~~chaotic~~ gameplay that players loved."
      - "**Bomb Blocks:** Breaking every block one by one felt painstaking in early tests, so we added bomb blocks that damage the blocks around them. It improved the game flow, added great juice and fueled the ~~chaos~~."
      - "**Card Upgrades:** Beyond the meta progression, in-level upgrades intrigued us. The gameplay allowed for a lot of unique upgrades, and we added more ^^legendary^^ ones to the pool as the player progressed."
    clips:
      - src: images/crash-attack-clip.mp4
        ratio: 512/640
    images:
      - images/crash-attack-1.jpg
      - images/crash-attack-2.jpg
      - images/crash-attack-4.jpg
    links:
      - label: Google Play
        url: https://play.google.com/store/apps/details?id=com.NearMintStudios.CrashAttack&hl=en_IN

  - title: "Ice Cream Connect!"
    star: true
    studio: Nearmint Studios
    genre: Puzzle
    role: Game Design, UI Design
    note: |-
      Ice Cream Connect! is a connect-the-dots game. Connect scoops of the same colour to serve your customers, but be quick, because customers have limited patience.

      Built during a 4-week internal game jam. Attracted Voodoo's attention on release.
    details:
      - "**Customer Patience:** We liked the idea of a serve-the-customers layer on top of the connect-the-dots gameplay. It made the gameplay driven, with a constantly changing objective."
    clips:
      - src: images/ice-cream-connect-clip.mp4
        ratio: 288/640
    images:
      - images/ice-cream-connect-1.jpg
      - images/ice-cream-connect-2.jpg
      - images/ice-cream-connect-3.jpg
      - images/ice-cream-connect-4.jpg
    links:
      - label: Google Play
        url: https://play.google.com/store/apps/details?id=com.NearMintStudios.IceCreamConnect&hl=en_IN

  - title: Space Merge
    star: true
    studio: Nearmint Studios
    genre: Puzzle, Merge
    role: Game Design, Systems Design, Unity Development
    credit: Made for JustPlay by Gimica Games
    meteors: true
    stars: true
    note: |-
      Drop planets into a small gravity pocket, and two similar planets merge into a bigger one. Can you merge your way up to the sun?
    details:
      - "**Central Gravity:** This system took the most tuning in the game, and it's what makes it stand out from the usual Suika-likes. We tuned the gravity falloff through the field radius, and added a @@spring force@@ at the center so planets settle instead of swinging back and forth through it. The %%wavy%% feel of the gravity field was also fun to get right, and it gives great feedback to player actions."
      - "**Planet Feel:** The planets had to feel light, but heavy enough that small ones wedge into small gaps and merge easily, which keeps the gameplay flowing."
      - "**Little Character Dude:** Canonically named.... $$Mike$$... yeah I dunno... He's a dynamic element on the screen that constantly reacts to the player, with random dialogue for moments like discovering a new planet, beating your high score, unlocking the sun or failing."
    clips:
      - src: images/space-merge-clip.mp4
        ratio: 720/900
    images:
      - images/space-merge-1.png
      - images/space-merge-2.png
      - images/space-merge-3.png
    links: []

  - title: Peg Drop
    star: true
    studio: Nearmint Studios
    genre: Arcade
    role: Game Design, Systems Design, Unity Development
    credit: Made for PlayOn by Papaya Stars
    ripple: "#bafd4d"
    note: |-
      Shoot balls onto pegs to bounce around and destroy them. Hit as many pegs as you can to build a crazy score multiplier, and touch special pegs to activate powerups!
    details:
      - "**Ball Physics:** Balancing the ball physics to get as many peg hits as possible took a lot of fine tuning."
      - "**Special Powerups:** Blue pegs activate ##powerups##, giving the player 2 options to choose from. Each layout features around 4-5 blue pegs, which keeps the level flowing and lets players make good use of their limited balls."
      - "**Extra Ball:** Hitting enough pegs rewards an extra ball, which rewards smart play. This works great for the platform, since it was all about rewarding skill."
    clips:
      - src: images/peg-drop-clip.mp4
        ratio: 9/16
    images:
      - images/peg-drop-1.png
      - images/peg-drop-2.png
      - images/peg-drop-3.png
    links: []

