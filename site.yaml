  - title: "I Ended A 100-Year War By Spinning A Yo-Yo!"
    star: true
    studio: Game Jams
    genre: Tower Defence
    role: Game Designer, Systems Designer, Economy Balance
    note: |-
      I Ended A 100-Year War By Spinning A Yo-Yo!, or IEA100YWBSAY for short (which isn't really short, is it?), is a tower defence roguelite. Defend the kingdom by spinning your trusty yo-yo, and get upgrades as you beat waves of enemies to power it up.

      This game was made in 4 days for a game jam. I challenged myself to design and balance the economy to fit a set playtime of about 15-20 minutes.
